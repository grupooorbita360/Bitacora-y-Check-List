<script>
  // ---------------------------------------------------------------------
  // Checklist (Checklist_Config + Checklist_Runs, sección 38.1 del prompt
  // maestro — backend de Fase 3, vista agregada ahora en Fase 4). Cada fila
  // es una actividad activa del departamento del usuario; "Registrar"
  // abre el modal para dejar una ejecución (Checklist_Runs) con su
  // resultado, y si el resultado es un problema ofrece convertirla en Task
  // de seguimiento (System Origin = CHECKLIST) — el mismo flujo que ya
  // describe el comentario de ChecklistService.convertRunToTask.
  // ---------------------------------------------------------------------
  function checklistItemRowHtml(item) {
    var ayuda = item.Ayuda
      ? '<details class="collapsible" style="margin-top:4px;"><summary>Ayuda</summary>' +
        '<p class="view-subtitle" style="margin:4px 0 0;">' + escapeHtml(item.Ayuda) + '</p></details>'
      : '';
    return (
      '<tr>' +
      '<td><strong>' + escapeHtml(item.Actividad) + '</strong>' + ayuda + '</td>' +
      '<td><span class="badge type-' + item.Tipo + '">' + (CHECKLIST_TYPE_LABELS[item.Tipo] || item.Tipo) + '</span></td>' +
      '<td>' + (CHECKLIST_FREQUENCY_LABELS[item.Frecuencia] || item.Frecuencia) + '</td>' +
      '<td><span class="badge priority-' + item.Prioridad + '">' + item.Prioridad + '</span></td>' +
      '<td><button onclick="openRecordChecklistModal(\'' + escapeJsString(item.ID) + '\')">Registrar</button></td>' +
      '</tr>'
    );
  }

  function checklistBodyHtml(items) {
    var rows = items.map(checklistItemRowHtml).join('');
    return (
      '<h2 class="view-title">Checklist</h2>' +
      '<p class="view-subtitle">' + items.length + ' actividad(es) activa(s) en tu departamento</p>' +
      (items.length
        ? '<table class="tasks-table"><thead><tr><th>Actividad</th><th>Tipo</th><th>Frecuencia</th><th>Prioridad</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>'
        : '<div class="empty-state">No hay actividades de checklist configuradas para tu departamento.</div>')
    );
  }

  async function renderChecklistHtml() {
    var items = await Api.listChecklist(App.token, App.user['Department ID']);
    // Cacheado para que el modal de "Registrar" (Client_Modals.html) pueda
    // leer Tipo/Actividad/Ayuda sin pedirlas de nuevo al backend.
    App._checklistItems = items;
    return checklistBodyHtml(items);
  }
</script>
