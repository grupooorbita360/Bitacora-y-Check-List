<script>
  // callServer(fnName, ...args) -> Promise. Usa google.script.run en
  // producción (Apps Script); si no existe (dev server local), cae a
  // fetch contra /rpc/<fnName> — ver apps-script/devserver/server.js.
  // El resto del cliente nunca llama a google.script.run directamente.
  function callServer(fnName) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      if (window.google && window.google.script && window.google.script.run) {
        var runner = google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(function (err) {
            reject(new Error(err && err.message ? err.message : String(err)));
          });
        runner[fnName].apply(runner, args);
        return;
      }
      fetch('/rpc/' + fnName, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(args)
      })
        .then(function (res) {
          return res.json().then(function (body) {
            return { ok: res.ok, body: body };
          });
        })
        .then(function (pair) {
          if (!pair.ok || !pair.body.ok) {
            reject(new Error((pair.body && pair.body.error) || 'Error de servidor'));
            return;
          }
          resolve(pair.body.result);
        })
        .catch(reject);
    });
  }

  var Api = {
    startLogin: function () {
      return callServer('api_startLogin');
    },
    loginWithPin: function (loginId, pin) {
      return callServer('api_loginWithPin', loginId, pin);
    },
