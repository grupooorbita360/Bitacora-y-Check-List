<script>
  var App = {
    token: localStorage.getItem('sessionToken') || null,
    user: null,
    departments: [],
    route: { name: 'login' }
  };

  function setToken(token) {
    App.token = token;
    if (token) {
      localStorage.setItem('sessionToken', token);
    } else {
      localStorage.removeItem('sessionToken');
    }
  }

  function logout() {
    setToken(null);
    App.user = null;
    App._tasksCanBulk = undefined; // depende del rol de la sesión anterior — se vuelve a pedir con el próximo login
    navigate('login');
  }

  // ---- Router muy simple basado en hash: #/dashboard, #/tasks, #/tasks/T00001, #/checklist ----
  function navigate(name, params) {
    params = params || {};
    if (name === 'task-detail') {
      location.hash = '#/tasks/' + params.taskId;
    } else if (name === 'tasks') {
      location.hash = '#/tasks';
    } else if (name === 'checklist') {
      location.hash = '#/checklist';
    } else if (name === 'dashboard') {
      location.hash = '#/dashboard';
    } else if (name === 'login') {
      App.route = { name: 'login' };
      render();
    }
  }

  function parseRoute() {
    var hash = location.hash.replace(/^#\/?/, '');
    var parts = hash.split('/').filter(Boolean);
    if (parts[0] === 'tasks' && parts[1]) {
      return { name: 'task-detail', taskId: parts[1] };
    }
    if (parts[0] === 'tasks') {
      return { name: 'tasks' };
    }
    if (parts[0] === 'checklist') {
      return { name: 'checklist' };
    }
    return { name: 'dashboard' };
  }

  window.addEventListener('hashchange', function () {
    if (!App.user) return;
    App.route = parseRoute();
    render();
  });

  // ---- Utilidades de formato/escape ----
  function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // Todos los onclick="fn('...')" del render se arman concatenando IDs
  // dentro de un literal JS de comillas simples. Esos IDs son siempre
  // generados por el backend (T00001, U004, ADJ00001...) y no deberían
  // traer comillas — pero si alguna vez uno se cargó a mano en el Sheet
  // con un apóstrofo, esa comilla sin escapar rompe el JS del atributo:
  // la fila se ve igual (el cursor:pointer es puramente CSS) pero el click
  // no hace nada. escapeJsString cierra ese caso además de ser la forma
  // correcta de interpolar cualquier valor dinámico en un onclick inline.
  function escapeJsString(value) {
    return String(value == null ? '' : value).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  }

  function formatDate(value) {
    if (!value) return '—';
    var d = new Date(value);
    if (isNaN(d.getTime())) return String(value);
    return d.toLocaleDateString('es-MX', { year: 'numeric', month: 'short', day: 'numeric' });
  }

  function formatDateTime(value) {
    if (!value) return '—';
    var d = new Date(value);
    if (isNaN(d.getTime())) return String(value);
    return d.toLocaleString('es-MX', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  var STATUS_LABELS = {
    PENDING: 'Pendiente',
    IN_PROGRESS: 'En Progreso',
    WAITING: 'En Espera',
    COMPLETED: 'Completada',
    CANCELLED: 'Cancelada'
  };

  var ACTION_LABELS = {
    OPEN: 'Abrir',
    COMPLETE: 'Completar',
    SNOOZE: 'Posponer',
    RESUME: 'Reanudar',
    CANCEL: 'Cancelar',
    REOPEN: 'Reabrir',
    REASSIGN: 'Reasignar',
    TAKE_OWNERSHIP: 'Tomar Ownership',
    ADD_COMMENT: 'Comentar',
    ADD_PARTICIPANT: 'Agregar Participante',
    REMOVE_PARTICIPANT: 'Quitar Participante',
    CREATE_SUBTASK: 'Agregar Subtarea',
    REQUEST_ADJUSTMENT: 'Pedir Ajuste'
  };

  var EVENT_LABELS = {
    CREATED: 'Task creada',
    ASSIGNED: 'Asignada',
    OPENED: 'Abierta',
    OWNERSHIP_TAKEN: 'Ownership tomado',
    COMPLETED: 'Completada',
    CANCELLED: 'Cancelada',
    REOPENED: 'Reabierta',
    SNOOZED: 'Pospuesta',
    RESUMED: 'Reanudada',
    COMMENT_ADDED: 'Comentario',
    REASSIGNED: 'Reasignada',
    ADJUSTMENT_REQUESTED: 'Ajuste solicitado',
    ADJUSTMENT_APPROVED: 'Ajuste aprobado',
    ADJUSTMENT_REJECTED: 'Ajuste rechazado',
    PARTICIPANT_ADDED: 'Participante agregado',
    PARTICIPANT_REMOVED: 'Participante quitado',
    SUBTASK_CREATED: 'Subtarea creada',
    SUBTASK_COMPLETED: 'Subtarea completada'
  };

  // Checklist_Config.Tipo (docs/01-modelo-datos.md): CHECK = marcar hecho/
  // no hecho, DATA = capturar un dato/cifra.
  var CHECKLIST_TYPE_LABELS = {
    CHECK: 'Check',
    DATA: 'Dato'
  };

  // Frecuencia sigue siendo texto libre en Checklist_Config (todavía sin
  // catálogo cerrado — ver docs/01-modelo-datos.md): estas son solo las
  // etiquetas de los valores ya sembrados en 95_SetupTasks.js; cualquier
  // otro valor se muestra tal cual llega del Sheet.
  var CHECKLIST_FREQUENCY_LABELS = {
    DIARIA: 'Diaria',
    SEMANAL_LUN: 'Semanal (lunes)'
  };

  // ---- Toasts ----
  function toast(message, type) {
    var stack = document.getElementById('toast-stack');
    if (!stack) {
      stack = document.createElement('div');
      stack.id = 'toast-stack';
      stack.className = 'toast-stack';
      document.body.appendChild(stack);
    }
    var el = document.createElement('div');
    el.className = 'toast' + (type ? ' ' + type : '');
    el.textContent = message;
    stack.appendChild(el);
    setTimeout(function () {
      el.remove();
    }, 4000);
  }

  function showError(err) {
    toast(err && err.message ? err.message : String(err), 'error');
  }

  // ---------------------------------------------------------------------
  // Polling (Dashboard/Tasks/Task Detail se refrescan solos cada 20s,
  // pausado mientras la pestaña no está visible). Solo una vista sondea a
  // la vez — render() llama stopPolling() antes de decidir la ruta actual.
  // ---------------------------------------------------------------------
  var POLL_INTERVAL_MS = 20000;
  App._stopPolling = null;

  function startPolling(intervalMs, checkFn) {
    function tick() {
      if (document.visibilityState === 'visible') checkFn();
    }
    var timer = setInterval(tick, intervalMs);
    // Al volver a la pestaña no esperamos hasta el próximo tick: se
    // refresca de una vez si había cambios pendientes.
    document.addEventListener('visibilitychange', tick);
    return function stop() {
      clearInterval(timer);
      document.removeEventListener('visibilitychange', tick);
    };
  }

  function stopPolling() {
    if (App._stopPolling) {
      App._stopPolling();
      App._stopPolling = null;
    }
  }

  function schedulePolling(checkFn) {
    stopPolling();
    App._stopPolling = startPolling(POLL_INTERVAL_MS, checkFn);
  }

  function versionsEqual(a, b) {
    if (!a || !b) return false;
    return JSON.stringify(a) === JSON.stringify(b);
  }
</script>
