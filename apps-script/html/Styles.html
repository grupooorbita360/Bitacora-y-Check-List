<style>
  :root {
    --color-bg: #f4f5f7;
    --color-surface: #ffffff;
    --color-border: #dfe2e7;
    --color-text: #1f2430;
    --color-text-muted: #6b7280;
    --color-primary: #2b5cd9;
    --color-primary-hover: #1f47b0;
    --color-danger: #d0342c;
    --color-warning: #b6790a;
    --color-success: #1a8f5e;
    --radius: 6px;
    --sidebar-width: 220px;
    --header-height: 56px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 14px;
  }

  #app { min-height: 100%; }

  .boot-loading {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    color: var(--color-text-muted);
  }

  button {
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    border-radius: var(--radius);
    border: 1px solid var(--color-border);
    background: var(--color-surface);
    color: var(--color-text);
    padding: 7px 14px;
  }
  button:hover { background: #f0f1f3; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  button.primary {
    background: var(--color-primary);
    border-color: var(--color-primary);
    color: #fff;
  }
  button.primary:hover { background: var(--color-primary-hover); }

  button.danger { color: var(--color-danger); border-color: var(--color-danger); background: #fff; }
  button.danger:hover { background: #fdecea; }

  button.link {
    border: none;
    background: none;
    color: var(--color-primary);
    padding: 2px 4px;
  }
  button.link:hover { text-decoration: underline; background: none; }

  input, select, textarea {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 9px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    background: #fff;
    color: var(--color-text);
    width: 100%;
  }

  label { display: block; font-size: 12px; color: var(--color-text-muted); margin-bottom: 4px; }
  .field { margin-bottom: 12px; }

  /* ---------- Login ---------- */
  .login-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }
  .login-card {
    width: 340px;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 28px;
  }
  .login-card h1 { font-size: 17px; margin: 0 0 4px; }
  .login-card p.subtitle { color: var(--color-text-muted); margin: 0 0 20px; font-size: 13px; }
  .login-error { color: var(--color-danger); font-size: 13px; margin-top: 10px; }
  .pin-input { letter-spacing: 6px; font-size: 20px; text-align: center; }

  /* ---------- Layout ---------- */
  .app-shell { display: flex; min-height: 100vh; }

  .sidebar {
    width: var(--sidebar-width);
    flex-shrink: 0;
    background: #171d2e;
    color: #cdd3e0;
    display: flex;
    flex-direction: column;
    padding: 16px 0;
    /* sticky (no un height:100vh en .app-shell) porque Apps Script sirve
       la página adentro de un iframe cuyo alto no siempre coincide con el
       viewport — depender de que el layout interno "recorte" para scrollear
       adentro de .content es frágil ahí. Con sticky, la página completa
       puede scrollear con normalidad y el sidebar se queda fijo igual. */
    position: sticky;
    top: 0;
    height: 100vh;
    align-self: flex-start;
  }
  .sidebar .brand { font-weight: 600; color: #fff; padding: 0 18px 18px; font-size: 15px; }
  .sidebar nav { display: flex; flex-direction: column; gap: 2px; }
  .sidebar nav button {
    all: unset;
    cursor: pointer;
    padding: 10px 18px;
    font-size: 13px;
    color: #cdd3e0;
  }
  .sidebar nav button:hover { background: #232b40; color: #fff; }
  .sidebar nav button.active { background: var(--color-primary); color: #fff; }

  .main-column { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    height: var(--header-height);
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
  }
  .topbar .user-info { font-size: 13px; color: var(--color-text-muted); display: flex; gap: 10px; align-items: center; }
  .topbar .user-info strong { color: var(--color-text); }

  /* Sin overflow-y propio: la página completa scrollea (ver .sidebar de
     arriba sobre por qué, dado el iframe de Apps Script), y .topbar/
     .sidebar quedan fijos por su position:sticky. */
  .content { padding: 22px; flex: 1; }

  h2.view-title { margin: 0 0 4px; font-size: 18px; }
  p.view-subtitle { margin: 0 0 18px; color: var(--color-text-muted); font-size: 13px; }

  /* ---------- Dashboard ---------- */
  .stat-grid { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 24px; }
  .stat-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 16px 20px;
    min-width: 140px;
  }
  .stat-card .value { font-size: 26px; font-weight: 600; }
  .stat-card .label { color: var(--color-text-muted); font-size: 12px; margin-top: 2px; }
  .stat-card.overdue .value { color: var(--color-danger); }

  /* ---------- Tasks list ---------- */
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar .spacer { flex: 1; }
  .toolbar input[type="search"] { max-width: 240px; }
  .toolbar select { max-width: 160px; }

  table.tasks-table { width: 100%; border-collapse: collapse; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); overflow: hidden; }
  table.tasks-table th, table.tasks-table td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--color-border); font-size: 13px; }
  table.tasks-table th { background: #fafbfc; color: var(--color-text-muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; }
  table.tasks-table tbody tr { cursor: pointer; }
  table.tasks-table tbody tr:hover { background: #f5f7fb; }
  table.tasks-table tbody tr:last-child td { border-bottom: none; }
  .empty-state { padding: 40px; text-align: center; color: var(--color-text-muted); }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 100px; font-size: 11px; font-weight: 600; }
  .badge.status-PENDING { background: #eef0f4; color: #4b5262; }
  .badge.status-IN_PROGRESS { background: #e2ecff; color: var(--color-primary); }
  .badge.status-WAITING { background: #fdf1da; color: var(--color-warning); }
  .badge.status-COMPLETED { background: #e1f5ec; color: var(--color-success); }
  .badge.status-CANCELLED { background: #fbe6e5; color: var(--color-danger); }
  .badge.priority-P1 { background: #fbe6e5; color: var(--color-danger); }
  .badge.priority-P2 { background: #fdf1da; color: var(--color-warning); }
  .badge.priority-P3 { background: #eef0f4; color: #4b5262; }

  /* ---------- Task detail ---------- */
  .detail-layout { display: flex; gap: 20px; align-items: flex-start; }
  .detail-main { flex: 1; min-width: 0; }
  .detail-side { width: 300px; flex-shrink: 0; }

  .panel {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 16px;
  }
  .panel h3 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--color-text-muted); }
  .panel .meta-row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 13px; border-bottom: 1px solid #f0f1f3; }
  .panel .meta-row:last-child { border-bottom: none; }
  .panel .meta-row .k { color: var(--color-text-muted); }

  .action-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }

  .comment-item, .history-item, .list-item { padding: 8px 0; border-bottom: 1px solid #f0f1f3; font-size: 13px; }
  .comment-item:last-child, .history-item:last-child, .list-item:last-child { border-bottom: none; }
  .comment-item .meta, .history-item .meta { color: var(--color-text-muted); font-size: 11px; margin-top: 2px; }

  details.collapsible summary { cursor: pointer; font-size: 13px; color: var(--color-primary); margin-bottom: 8px; }

  .inline-form { display: flex; gap: 8px; margin-top: 10px; }
  .inline-form input { flex: 1; }

  /* ---------- Modals ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 24, 34, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
  }
  .modal-box {
    width: 420px;
    max-width: calc(100vw - 32px);
    max-height: calc(100vh - 60px);
    overflow-y: auto;
    background: var(--color-surface);
    border-radius: var(--radius);
    padding: 20px 22px;
  }
  .modal-box h3 { margin: 0 0 4px; font-size: 15px; }
  .modal-box p.modal-subtitle { margin: 0 0 16px; color: var(--color-text-muted); font-size: 12px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .form-error { color: var(--color-danger); font-size: 12px; margin-top: 8px; }

  .toast-stack { position: fixed; top: 16px; right: 16px; z-index: 100; display: flex; flex-direction: column; gap: 8px; }
  .toast { background: #1f2430; color: #fff; padding: 10px 16px; border-radius: var(--radius); font-size: 13px; max-width: 320px; }
  .toast.error { background: var(--color-danger); }
  .toast.success { background: var(--color-success); }

  /* Desktop-first: el layout asume >=1024px; a partir de ahí colapsa a una
     columna sin romperse, sin ser el foco de diseño (sección 44-57). */
  @media (max-width: 900px) {
    .detail-layout { flex-direction: column; }
    .detail-side { width: 100%; }
  }
  @media (max-width: 720px) {
    .sidebar { width: 64px; }
    .sidebar .brand, .sidebar nav button span.label { display: none; }
  }
</style>
