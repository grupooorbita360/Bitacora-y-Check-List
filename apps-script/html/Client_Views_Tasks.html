<script>
  // ---------------------------------------------------------------------
  // Tasks (pestañas por rol + lista + filtros + búsqueda)
  //
  // Sección 44 del prompt maestro (texto literal no disponible en esta
  // sesión — ver docs/07-fase-4-decisiones.md sobre esa limitación, y
  // docs/12-tabs-tasks-logout.md para el detalle de esta implementación):
  // Agent ve "Mis Tasks/Equipo/En espera/Completadas"; Supervisor agrega
  // "Supervisión"; Manager/Director agregan "Departamento" (en vez de
  // "Equipo") y "Management". Cada pestaña es un filtro server-side
  // (filters.tab en 98_Api.js) ADICIONAL sobre lo que TaskPermissionService
  // ya permite ver — nunca amplía el acceso, solo lo organiza.
  // ---------------------------------------------------------------------
  App.taskFilters = App.taskFilters || { status: '', priority: '', mineOnly: false, overdueOnly: false, search: '' };

  // userIsManagerOrAbove()/userIsSupervisorOrAbove() (Client_State.html)
  // resuelven la jerarquía de rol sobre App.user.roles.
  function taskTabsForUser() {
    var isManagerTier = userIsManagerOrAbove();
    var isSupervisorTier = userIsSupervisorOrAbove();
    var tabs = [
      { key: 'MINE', label: 'Mis Tasks' },
      { key: 'TEAM', label: isManagerTier ? 'Departamento' : 'Equipo' },
      { key: 'WAITING', label: 'En espera' },
      { key: 'DONE', label: 'Completadas' }
    ];
    if (isSupervisorTier) tabs.push({ key: 'SUPERVISION', label: 'Supervisión' });
    if (isManagerTier) tabs.push({ key: 'MANAGEMENT', label: 'Management' });
    return tabs;
  }

  // Si la pestaña activa no es válida para el rol actual (primera visita,
  // o el usuario cambió de sesión sin pasar por logout) cae a "Mis Tasks".
  function activeTaskTabOrDefault() {
    var validKeys = taskTabsForUser().map(function (t) {
      return t.key;
    });
    if (!App.activeTaskTab || validKeys.indexOf(App.activeTaskTab) === -1) {
      App.activeTaskTab = 'MINE';
    }
    return App.activeTaskTab;
  }

  function setActiveTaskTab(tabKey) {
    App.activeTaskTab = tabKey;
    App.teamOwnerFilter = null; // el desglose por persona es específico de la pestaña anterior
    render();
  }

  // tabKey siempre es un literal fijo de taskTabsForUser() (nunca un dato
  // dinámico), igual que el resto de los onclick sin argumentos de usuario.
  function taskTabsBarHtml(tabs, activeTab) {
    var buttons = tabs
      .map(function (t) {
        return '<button class="' + (t.key === activeTab ? 'active' : '') + '" onclick="setActiveTaskTab(\'' + t.key + '\')">' + t.label + '</button>';
      })
      .join('');
    return '<div class="task-tabs">' + buttons + '</div>';
  }

  // Desglose por persona (pestaña Equipo/Departamento): cuenta Tasks por
  // Owner sobre el set YA filtrado por tab en el servidor. 'Owner' (nombre)
  // ya viene en cada Task junto a 'Owner ID' — igual que usa taskRowHtml
  // para la columna Owner — así que no hace falta resolverlo aparte.
  function computeOwnerBreakdown(tasks) {
    var counts = {};
    var names = {};
    tasks.forEach(function (t) {
      var id = t['Owner ID'];
      counts[id] = (counts[id] || 0) + 1;
      names[id] = t.Owner;
    });
    return Object.keys(counts)
      .map(function (id) {
        return { ownerId: id, name: names[id] || id, count: counts[id] };
      })
      .sort(function (a, b) {
        return b.count - a.count;
      });
  }

  function setTeamOwnerFilter(ownerId) {
    App.teamOwnerFilter = ownerId || null;
    render();
  }

  function teamBreakdownHtml(breakdown, activeOwnerId) {
    if (!breakdown.length) return '';
    var total = breakdown.reduce(function (sum, b) {
      return sum + b.count;
    }, 0);
    var chips = '<button class="chip' + (activeOwnerId ? '' : ' active') + '" onclick="setTeamOwnerFilter(null)">Todos (' + total + ')</button>';
    chips += breakdown
      .map(function (b) {
        var active = String(activeOwnerId) === String(b.ownerId);
        return (
          '<button class="chip' + (active ? ' active' : '') + '" onclick="setTeamOwnerFilter(\'' + escapeJsString(b.ownerId) + '\')">' +
          escapeHtml(b.name) + ': ' + b.count + '</button>'
        );
      })
      .join('');
    return '<div class="team-breakdown">' + chips + '</div>';
  }

  function tasksBodyHtml(tasks, canBulk) {
    var rows = tasks.map(taskRowHtml).join('');
    return (
      '<h2 class="view-title">Tasks</h2>' +
      '<p class="view-subtitle">' + tasks.length + ' Task(s)</p>' +
      '<div class="toolbar">' +
      '<select onchange="setTaskFilter(\'status\', this.value)">' + optionsFor(STATUS_LABELS, App.taskFilters.status, 'Todos los estados') + '</select>' +
      '<select onchange="setTaskFilter(\'priority\', this.value)">' +
      optionsFor({ P1: 'P1', P2: 'P2', P3: 'P3' }, App.taskFilters.priority, 'Toda prioridad') +
      '</select>' +
      '<label style="display:flex;align-items:center;gap:6px;color:var(--color-text-muted);font-size:12px;">' +
      '<input type="checkbox" style="width:auto" ' + (App.taskFilters.mineOnly ? 'checked' : '') + ' onchange="setTaskFilter(\'mineOnly\', this.checked)" /> Solo mías' +
      '</label>' +
      '<label style="display:flex;align-items:center;gap:6px;color:var(--color-text-muted);font-size:12px;">' +
      '<input type="checkbox" style="width:auto" ' + (App.taskFilters.overdueOnly ? 'checked' : '') + ' onchange="setTaskFilter(\'overdueOnly\', this.checked)" /> Vencidas' +
      '</label>' +
      '<input type="search" placeholder="Buscar por título… (Enter)" value="' + escapeHtml(App.taskFilters.search) + '" onchange="setTaskFilter(\'search\', this.value)" />' +
      '<div class="spacer"></div>' +
      (canBulk ? '<button onclick="openBulkReassignModal()">Reasignar en bloque</button>' : '') +
      '<button class="primary" onclick="openNewTaskModal()">+ Nueva Task</button>' +
      '</div>' +
      (tasks.length
        ? '<table class="tasks-table"><thead><tr><th>Título</th><th>Tipo</th><th>Owner</th><th>Prioridad</th><th>Estado</th><th>Vence</th></tr></thead><tbody>' + rows + '</tbody></table>'
        : '<div class="empty-state">No hay Tasks que coincidan con el filtro.</div>')
    );
  }

  function computeTasksVersionFromList(tasks) {
    var latest = 0;
    tasks.forEach(function (t) {
      var updated = t['Updated At'] ? new Date(t['Updated At']).getTime() : 0;
      if (updated > latest) latest = updated;
    });
    return { count: tasks.length, latestUpdatedAt: latest };
  }

  // canBulkReassign depende solo del rol, que no cambia dentro de la misma
  // sesión — se pide una vez y se reutiliza. Antes se repetía en cada
  // render de Tasks (cada cambio de filtro entraba por acá de nuevo),
  // sumando una llamada de red evitable a cada click en un dropdown.
  async function getCanBulkReassignCached() {
    if (App._tasksCanBulk === undefined) {
      App._tasksCanBulk = await Api.canBulkReassign(App.token);
    }
    return App._tasksCanBulk;
  }

  // Trae las Tasks de la pestaña activa. El desglose por persona (solo en
  // TEAM) se calcula sobre el set COMPLETO que devolvió el servidor para
  // ese tab, antes de aplicar el drill-down por dueño — si no, elegir a
  // alguien solo dejaría verlo a él mismo en su propio desglose. La
  // "versión" para el polling también se calcula sobre ese set completo
  // (allTasksForVersion), igual que api_getTasksVersion — así el drill-down
  // por persona (puramente client-side, nunca viaja al servidor) no hace
  // que el polling piense todo el tiempo que algo cambió.
  async function fetchTasksForCurrentTab() {
    var tab = activeTaskTabOrDefault();
    var filters = Object.assign({}, App.taskFilters, { tab: tab });
    var allTasksForTab = await Api.listTasks(App.token, filters);
    var breakdown = null;
    var tasks = allTasksForTab;
    if (tab === 'TEAM') {
      breakdown = computeOwnerBreakdown(allTasksForTab);
      if (App.teamOwnerFilter) {
        tasks = allTasksForTab.filter(function (t) {
          return String(t['Owner ID']) === String(App.teamOwnerFilter);
        });
      }
    }
    return { tab: tab, filters: filters, tasks: tasks, allTasksForVersion: allTasksForTab, breakdown: breakdown };
  }

  function composeTasksHtml(result, canBulk) {
    return (
      taskTabsBarHtml(taskTabsForUser(), result.tab) +
      (result.breakdown ? teamBreakdownHtml(result.breakdown, App.teamOwnerFilter) : '') +
      tasksBodyHtml(result.tasks, canBulk)
    );
  }

  async function renderTasksHtml() {
    var result = await fetchTasksForCurrentTab();
    var canBulk = await getCanBulkReassignCached();
    App._tasksVersion = computeTasksVersionFromList(result.allTasksForVersion);
    return composeTasksHtml(result, canBulk);
  }

  // Endpoint liviano (solo count + Updated At más reciente): si no cambió
  // nada, no vuelve a pedir la lista completa ni a re-renderizar la tabla
  // (evita perder el estado de scroll/foco sin necesidad).
  async function pollTasksList() {
    try {
      var tab = activeTaskTabOrDefault();
      var filters = Object.assign({}, App.taskFilters, { tab: tab });
      var version = await Api.getTasksVersion(App.token, filters);
      if (versionsEqual(version, App._tasksVersion)) return;
      var result = await fetchTasksForCurrentTab();
      App._tasksVersion = computeTasksVersionFromList(result.allTasksForVersion);
      document.getElementById('content').innerHTML = composeTasksHtml(result, App._tasksCanBulk);
    } catch (e) {
      // silencioso
    }
  }

  function optionsFor(labelMap, selected, blankLabel) {
    var html = '<option value=""' + (selected ? '' : ' selected') + '>' + blankLabel + '</option>';
    Object.keys(labelMap).forEach(function (key) {
      html += '<option value="' + key + '"' + (selected === key ? ' selected' : '') + '>' + labelMap[key] + '</option>';
    });
    return html;
  }

  function setTaskFilter(key, value) {
    App.taskFilters[key] = value;
    render();
  }

  function taskRowHtml(t) {
    return (
      '<tr onclick="navigate(\'task-detail\', {taskId: \'' + escapeJsString(t['Task ID']) + '\'})">' +
      '<td>' + escapeHtml(t['Task Title']) + '</td>' +
      '<td>' + escapeHtml(t.Type) + '</td>' +
      '<td>' + escapeHtml(t.Owner) + '</td>' +
      '<td><span class="badge priority-' + t.Priority + '">' + t.Priority + '</span></td>' +
      '<td><span class="badge status-' + t.Status + '">' + (STATUS_LABELS[t.Status] || t.Status) + '</span></td>' +
      '<td>' + formatDate(t['Due Date']) + '</td>' +
      '</tr>'
    );
  }
</script>
