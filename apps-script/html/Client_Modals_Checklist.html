<script>
  // ---------------------------------------------------------------------
  // Checklist: registrar una ejecución (Checklist_Runs) y, si salió con un
  // problema, ofrecer convertirla en Task de seguimiento (los 3 endpoints
  // ya existían desde Fase 3 — ver 44_ChecklistService.js). "OK"/"PROBLEMA"
  // ahora son Config.CHECKLIST_RESULT (00_Config.js), validado en
  // ChecklistService.recordRun — mismo conjunto que este <select> ofrece.
  // ---------------------------------------------------------------------
  function openRecordChecklistModal(checklistConfigId) {
    var item = (App._checklistItems || []).filter(function (i) {
      return String(i.ID) === String(checklistConfigId);
    })[0];
    if (!item) return;
    var isData = item.Tipo === 'DATA';
    openModal(
      '<h3>' + escapeHtml(item.Actividad) + '</h3>' +
      (item.Ayuda ? '<p class="modal-subtitle">' + escapeHtml(item.Ayuda) + '</p>' : '') +
      '<div class="field"><label>Resultado</label><select id="modal-resultado" onchange="toggleChecklistResultFields()">' +
      '<option value="OK">OK</option><option value="PROBLEMA">Problema</option>' +
      '</select></div>' +
      (isData ? '<div class="field"><label>Valor</label><input id="modal-valor" placeholder="Ingresa el valor" /></div>' : '') +
      '<div class="field" id="checklist-comment-field" style="display:none"><label>Comentario (obligatorio si hay un problema)</label><textarea id="modal-comment" rows="3"></textarea></div>' +
      '<div id="modal-error" class="form-error"></div>' +
      '<div class="modal-actions"><button onclick="closeModal()">Cancelar</button>' +
      '<button class="primary" onclick="submitRecordChecklistRun(\'' + escapeJsString(checklistConfigId) + '\')">Registrar</button></div>'
    );
  }

  function toggleChecklistResultFields() {
    var resultado = document.getElementById('modal-resultado').value;
    document.getElementById('checklist-comment-field').style.display = resultado === 'PROBLEMA' ? '' : 'none';
  }

  async function submitRecordChecklistRun(checklistConfigId) {
    var resultado = document.getElementById('modal-resultado').value;
    var valorField = document.getElementById('modal-valor');
    var valor = valorField ? valorField.value.trim() : '';
    var comment = document.getElementById('modal-comment').value.trim();
    if (resultado === 'PROBLEMA' && !comment) {
      document.getElementById('modal-error').textContent = 'Describe el problema en el comentario.';
      return;
    }
    try {
      var runId = await Api.recordChecklistRun(App.token, checklistConfigId, resultado, valor, comment);
      closeModal();
      if (resultado === 'PROBLEMA' && userIsSupervisorOrAbove()) {
        // Convertir es acción de Supervisor+ (docs/14-checklist-convert-role.md)
        // — un Agent solo reporta, así que ni se le ofrece el modal.
        offerConvertChecklistRunToTask(runId);
      } else if (resultado === 'PROBLEMA') {
        toast('Problema registrado. Un Supervisor deberá convertirlo en Task de seguimiento.', 'success');
      } else {
        toast('Registrado.', 'success');
      }
    } catch (e) {
      document.getElementById('modal-error').textContent = e.message;
    }
  }

  function offerConvertChecklistRunToTask(runId) {
    openModal(
      '<h3>Problema registrado</h3>' +
      '<p class="modal-subtitle">¿Quieres convertir esta ejecución en una Task de seguimiento?</p>' +
      '<div id="modal-error" class="form-error"></div>' +
      '<div class="modal-actions"><button onclick="closeModal()">No, gracias</button>' +
      '<button class="primary" onclick="submitConvertChecklistRunToTask(\'' + escapeJsString(runId) + '\')">Crear Task</button></div>'
    );
  }

  async function submitConvertChecklistRunToTask(runId) {
    try {
      var task = await Api.convertChecklistRunToTask(App.token, runId);
      closeModal();
      toast('Task de seguimiento creada.', 'success');
      navigate('task-detail', { taskId: task['Task ID'] });
    } catch (e) {
      document.getElementById('modal-error').textContent = e.message;
    }
  }
</script>
